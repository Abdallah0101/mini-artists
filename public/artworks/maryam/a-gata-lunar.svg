    <path d="M330 210 q55 10 60 60 q2 25 -15 30 q-12 4 -16 -8 q-3 -10 6 -14 q12 -6 8 -28 q-4 -25 -45 -30z" fill="#B78DF0" stroke="#6D3FD3" stroke-width="5" stroke-linejoin="round"/>
