    <path d="M80 80 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z"/>
    <path d="M510 90 l6 13 14 2 -10 10 2 14 -12 -7 -12 7 2 -14 -10 -10 14 -2z"/>
    <path d="M160 300 l5 11 12 2 -9 8 2 12 -10 -6 -10 6 2 -12 -9 -8 12 -2z"/>
    <path d="M450 320 l5 11 12 2 -9 8 2 12 -10 -6 -10 6 2 -12 -9 -8 12 -2z"/>
    <circle cx="250" cy="70" r="4"/><circle cx="340" cy="55" r="3"/>
    <circle cx="70" cy="220" r="4"/><circle cx="540" cy="220" r="4"/>
  </g>
  <!-- estrela cadente -->
  <g>
    <path d="M470 50 q-60 30 -100 70" stroke="#FFE9A8" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M480 42 l6 12 13 2 -10 9 3 13 -12 -7 -12 7 3 -13 -10 -9 13 -2z" fill="#FFE9A8"/>
