    <ellipse cx="298" cy="255" rx="18" ry="26" fill="#EFE4FB"/>
    <!-- cabeça -->
    <circle cx="295" cy="140" r="42" fill="#D3B8F7" stroke="#6D3FD3" stroke-width="5"/>
    <!-- orelhas -->
    <path d="M262 112 l-10 -30 l30 14z" fill="#D3B8F7" stroke="#6D3FD3" stroke-width="5" stroke-linejoin="round"/>
    <path d="M328 112 l10 -30 l-30 14z" fill="#D3B8F7" stroke="#6D3FD3" stroke-width="5" stroke-linejoin="round"/>
    <path d="M262 104 l-5 -15 l15 7z" fill="#FF8FB0"/>
    <path d="M328 104 l5 -15 l-15 7z" fill="#FF8FB0"/>
