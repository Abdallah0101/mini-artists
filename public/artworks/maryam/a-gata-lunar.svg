    <path d="M272 138 q6 -8 14 0 M304 138 q6 -8 14 0" fill="none" stroke="#100B35" stroke-width="4" stroke-linecap="round"/>
    <path d="M290 152 q5 5 10 0" fill="none" stroke="#C22B5C" stroke-width="4" stroke-linecap="round"/>
    <path d="M295 146 l-5 6 h10z" fill="#FF8FB0"/>
