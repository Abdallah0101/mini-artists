<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <!-- céu que vira noite -->
  <rect width="600" height="450" fill="#241a55"/>
  <rect y="230" width="600" height="220" fill="#2f2064"/>
  <!-- estrelas -->
  <g fill="#FFD45A">
    <path d="M70 60 l6 13 14 2 -10 10 2 14 -12 -7 -12 7 2 -14 -10 -10 14 -2z"/>
    <path d="M520 55 l6 13 14 2 -10 10 2 14 -12 -7 -12 7 2 -14 -10 -10 14 -2z"/>
    <path d="M300 40 l5 11 12 2 -9 8 2 12 -10 -6 -10 6 2 -12 -9 -8 12 -2z"/>
    <path d="M430 110 l4 9 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1z"/>
    <circle cx="180" cy="90" r="4"/><circle cx="380" cy="70" r="4"/>
    <circle cx="120" cy="150" r="3"/><circle cx="480" cy="160" r="3"/>
  </g>
  <!-- lua pequena -->
  <path d="M540 130 a30 30 0 1 1 -22 -52 a24 24 0 1 0 22 52z" fill="#FFE9A8" stroke="#E8C56A" stroke-width="4"/>
  <!-- grama -->
  <path d="M0 360 q150 -35 300 0 t300 0 l0 90 l-600 0z" fill="#2E7D5B"/>
  <path d="M0 385 q150 -25 300 0 t300 0 l0 65 l-600 0z" fill="#256B4D"/>
  <!-- flor grande brilhante (centro) -->
  <g>
    <path d="M300 400 v-90" stroke="#3EA873" stroke-width="9" stroke-linecap="round"/>
    <path d="M300 350 q-30 -8 -38 -30 q25 -5 38 12z" fill="#3EA873"/>
    <path d="M300 360 q30 -6 40 -28 q-26 -6 -40 10z" fill="#3EA873"/>
    <g fill="#FF8FB0" stroke="#C22B5C" stroke-width="4">
      <ellipse cx="300" cy="272" rx="16" ry="30"/>
      <ellipse cx="300" cy="272" rx="16" ry="30" transform="rotate(60 300 300)"/>
      <ellipse cx="300" cy="272" rx="16" ry="30" transform="rotate(-60 300 300)"/>
      <ellipse cx="300" cy="328" rx="16" ry="30" transform="rotate(180 300 300)"/>
      <ellipse cx="274" cy="285" rx="16" ry="30" transform="rotate(-120 300 300)"/>
      <ellipse cx="326" cy="285" rx="16" ry="30" transform="rotate(120 300 300)"/>
    </g>
    <circle cx="300" cy="300" r="18" fill="#FFD45A" stroke="#E8A93D" stroke-width="4"/>
    <!-- brilho da flor -->
    <g stroke="#FFE9A8" stroke-width="4" stroke-linecap="round">
      <path d="M300 246 v-14"/><path d="M300 354 v14"/>
      <path d="M246 300 h-14"/><path d="M354 300 h14"/>
      <path d="M262 262 l-10 -10"/><path d="M338 338 l10 10"/>
      <path d="M338 262 l10 -10"/><path d="M262 338 l-10 10"/>
    </g>
  </g>
  <!-- flor roxa esquerda -->
  <g>
    <path d="M130 410 v-60" stroke="#3EA873" stroke-width="7" stroke-linecap="round"/>
    <g fill="#B78DF0" stroke="#6D3FD3" stroke-width="4">
      <circle cx="112" cy="330" r="14"/><circle cx="148" cy="330" r="14"/>
      <circle cx="130" cy="312" r="14"/><circle cx="130" cy="348" r="14"/>
    </g>
    <circle cx="130" cy="330" r="11" fill="#FFD45A" stroke="#E8A93D" stroke-width="3"/>
  </g>
  <!-- flor azul direita -->
  <g>
    <path d="M470 405 v-55" stroke="#3EA873" stroke-width="7" stroke-linecap="round"/>
    <g fill="#7CCBF9" stroke="#2568A8" stroke-width="4">
      <circle cx="454" cy="332" r="13"/><circle cx="486" cy="332" r="13"/>
      <circle cx="470" cy="316" r="13"/><circle cx="470" cy="348" r="13"/>
    </g>
    <circle cx="470" cy="332" r="10" fill="#FFD45A" stroke="#E8A93D" stroke-width="3"/>
  </g>
  <!-- tulipinha laranja -->
  <g>
    <path d="M205 415 v-45" stroke="#3EA873" stroke-width="6" stroke-linecap="round"/>
    <path d="M190 370 q0 -22 15 -22 q15 0 15 22 q0 14 -15 14 q-15 0 -15 -14z" fill="#FF9D42" stroke="#E5711B" stroke-width="4"/>
    <path d="M198 352 l7 12 7 -12" fill="none" stroke="#E5711B" stroke-width="3"/>
  </g>
  <!-- borboleta -->
  <g>
    <path d="M395 250 q-25 -25 -45 -12 q-8 18 25 22 q-25 8 -15 25 q22 8 35 -15z" fill="#FF8FB0" stroke="#C22B5C" stroke-width="4" stroke-linejoin="round"/>
    <path d="M405 250 q25 -25 45 -12 q8 18 -25 22 q25 8 15 25 q-22 8 -35 -15z" fill="#FFD45A" stroke="#E8A93D" stroke-width="4" stroke-linejoin="round"/>
    <path d="M400 240 v45" stroke="#5B2E6E" stroke-width="5" stroke-linecap="round"/>
    <path d="M396 238 q-6 -12 -14 -14 M404 238 q6 -12 14 -14" stroke="#5B2E6E" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- vagalumes -->
  <g fill="#FFE9A8">
    <circle cx="90" cy="250" r="5"/><circle cx="250" cy="200" r="4"/>
    <circle cx="520" cy="230" r="5"/><circle cx="360" cy="160" r="4"/>
  </g>
  <g stroke="#FFE9A8" stroke-width="2" opacity=".6">
    <circle cx="90" cy="250" r="10" fill="none"/><circle cx="520" cy="230" r="10" fill="none"/>
  </g>
</svg>
