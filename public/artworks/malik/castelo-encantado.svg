<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#E8F4FF"/>
  <!-- arco-íris -->
  <g fill="none" stroke-linecap="round">
    <path d="M60 330 a240 240 0 0 1 480 0" stroke="#FF5C5C" stroke-width="16"/>
    <path d="M78 330 a222 222 0 0 1 444 0" stroke="#FF9D42" stroke-width="16"/>
    <path d="M96 330 a204 204 0 0 1 408 0" stroke="#FFD45A" stroke-width="16"/>
    <path d="M114 330 a186 186 0 0 1 372 0" stroke="#71D6A2" stroke-width="16"/>
    <path d="M132 330 a168 168 0 0 1 336 0" stroke="#55B8F7" stroke-width="16"/>
    <path d="M150 330 a150 150 0 0 1 300 0" stroke="#9B6BEA" stroke-width="16"/>
  </g>
  <!-- sol -->
  <g>
    <circle cx="85" cy="80" r="34" fill="#FFD45A" stroke="#E8A93D" stroke-width="5"/>
    <g stroke="#FFD45A" stroke-width="7" stroke-linecap="round">
      <path d="M85 25 v-14"/><path d="M125 45 l12 -10"/><path d="M140 80 h16"/>
      <path d="M45 45 l-12 -10"/><path d="M30 80 h-16"/>
    </g>
    <circle cx="76" cy="74" r="4" fill="#8a5a00"/><circle cx="95" cy="74" r="4" fill="#8a5a00"/>
    <path d="M76 88 q9 8 19 0" fill="none" stroke="#8a5a00" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- nuvens -->
  <g fill="#fff" stroke="#B7D9F5" stroke-width="5">
    <path d="M430 90 q5 -25 32 -22 q10 -18 32 -10 q22 -6 24 16 q18 4 10 20 q-6 12 -26 10 l-62 0 q-16 -2 -10 -14z"/>
    <path d="M160 120 q4 -20 26 -18 q8 -15 26 -8 q18 -5 20 13 q15 3 8 16 q-5 10 -21 8 l-50 0 q-13 -1 -9 -11z"/>
  </g>
  <!-- grama -->
  <path d="M0 380 q150 -30 300 0 t300 0 l0 70 l-600 0z" fill="#71D6A2" stroke="#3EA873" stroke-width="5"/>
  <!-- castelo -->
  <g stroke="#4B237C" stroke-width="6" stroke-linejoin="round">
    <!-- torre esquerda -->
    <rect x="170" y="230" width="70" height="150" fill="#B78DF0"/>
    <path d="M160 230 l45 -65 45 65z" fill="#FF5C8A"/>
    <!-- torre direita -->
    <rect x="360" y="230" width="70" height="150" fill="#B78DF0"/>
    <path d="M350 230 l45 -65 45 65z" fill="#FF5C8A"/>
    <!-- torre central -->
    <rect x="255" y="180" width="90" height="200" fill="#D3B8F7"/>
    <path d="M243 180 l57 -80 57 80z" fill="#FF5C8A"/>
    <!-- corpo -->
    <rect x="205" y="290" width="190" height="90" fill="#9B6BEA"/>
  </g>
  <!-- bandeirinhas -->
  <g stroke="#4B237C" stroke-width="4" stroke-linejoin="round">
    <path d="M300 100 v-30 l34 10 -34 12z" fill="#FFD45A"/>
    <path d="M205 165 v-24 l26 8 -26 10z" fill="#55B8F7"/>
    <path d="M395 165 v-24 l26 8 -26 10z" fill="#55B8F7"/>
  </g>
  <!-- porta e janelas -->
  <path d="M278 380 v-42 a22 22 0 0 1 44 0 v42z" fill="#6D3FD3" stroke="#4B237C" stroke-width="5"/>
  <circle cx="300" cy="240" r="14" fill="#FFF3B8" stroke="#4B237C" stroke-width="5"/>
  <circle cx="205" cy="270" r="10" fill="#FFF3B8" stroke="#4B237C" stroke-width="4"/>
  <circle cx="395" cy="270" r="10" fill="#FFF3B8" stroke="#4B237C" stroke-width="4"/>
  <!-- flores -->
  <g>
    <circle cx="90" cy="410" r="9" fill="#FF5C8A"/><circle cx="90" cy="410" r="3.5" fill="#FFD45A"/>
    <circle cx="140" cy="425" r="9" fill="#9B6BEA"/><circle cx="140" cy="425" r="3.5" fill="#FFD45A"/>
    <circle cx="470" cy="415" r="9" fill="#FF9D42"/><circle cx="470" cy="415" r="3.5" fill="#FFD45A"/>
    <circle cx="525" cy="405" r="9" fill="#FF5C8A"/><circle cx="525" cy="405" r="3.5" fill="#FFD45A"/>
  </g>
