<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <!-- céu noturno -->
  <rect width="600" height="450" fill="#241a55"/>
  <!-- estrelas -->
  <g fill="#FFD45A">
    <path d="M70 60 l6 13 14 2 -10 10 2 14 -12 -7 -12 7 2 -14 -10 -10 14 -2z"/>
    <path d="M520 70 l6 13 14 2 -10 10 2 14 -12 -7 -12 7 2 -14 -10 -10 14 -2z"/>
    <path d="M330 50 l5 11 12 2 -9 8 2 12 -10 -6 -10 6 2 -12 -9 -8 12 -2z"/>
    <circle cx="150" cy="120" r="5"/>
    <circle cx="450" cy="140" r="5"/>
    <circle cx="260" cy="95" r="4"/>
    <circle cx="560" cy="180" r="4"/>
    <circle cx="60" cy="190" r="4"/>
  </g>
  <!-- lua -->
  <path d="M510 110 a42 42 0 1 1 -30 -72 a34 34 0 1 0 30 72z" fill="#FFE9A8" stroke="#E8C56A" stroke-width="5" stroke-linejoin="round"/>
  <!-- montanhas -->
  <path d="M-10 450 L140 250 L290 450 z" fill="#4B237C" stroke="#341663" stroke-width="6" stroke-linejoin="round"/>
  <path d="M180 450 L360 220 L540 450 z" fill="#6D3FD3" stroke="#4B237C" stroke-width="6" stroke-linejoin="round"/>
  <path d="M330 262 l30 -42 30 42 q-30 14 -60 0z" fill="#fff" opacity=".85"/>
  <path d="M420 450 L520 330 L620 450z" fill="#3A1C6E" stroke="#2A1254" stroke-width="6" stroke-linejoin="round"/>
  <!-- dragão azul -->
  <g transform="rotate(-8 300 190)">
    <!-- asa de trás -->
    <path d="M315 150 q60 -70 130 -55 q-30 25 -38 42 q25 -8 40 -5 q-35 30 -90 48z" fill="#3E8FD4" stroke="#2568A8" stroke-width="6" stroke-linejoin="round"/>
    <!-- corpo -->
    <path d="M170 210 q60 -55 150 -45 q70 8 95 40 q15 22 5 40 q-15 25 -60 20 q-90 -8 -150 -15 q-45 -6 -40 -40z" fill="#55B8F7" stroke="#2568A8" stroke-width="6" stroke-linejoin="round"/>
    <!-- barriga -->
    <path d="M200 235 q90 15 190 12 q-10 20 -50 20 q-80 -6 -140 -14z" fill="#BFE9FF"/>
    <!-- asa da frente -->
    <path d="M300 155 q45 -85 125 -95 q-25 30 -28 50 q22 -12 38 -10 q-30 40 -95 75z" fill="#7CCBF9" stroke="#2568A8" stroke-width="6" stroke-linejoin="round"/>
    <!-- pescoço e cabeça -->
    <path d="M170 210 q-50 -15 -70 -50 q-8 -18 6 -28 q18 -12 40 2 q30 18 45 40z" fill="#55B8F7" stroke="#2568A8" stroke-width="6" stroke-linejoin="round"/>
    <!-- focinho -->
    <path d="M100 140 q-30 -5 -42 8 q20 10 42 12z" fill="#55B8F7" stroke="#2568A8" stroke-width="5" stroke-linejoin="round"/>
    <!-- chifres -->
    <path d="M115 120 l-6 -26 l20 16z" fill="#FFD45A" stroke="#E8A93D" stroke-width="4" stroke-linejoin="round"/>
    <path d="M135 112 l0 -26 l16 20z" fill="#FFD45A" stroke="#E8A93D" stroke-width="4" stroke-linejoin="round"/>
    <!-- olho -->
    <circle cx="118" cy="150" r="7" fill="#100B35"/>
    <circle cx="120" cy="148" r="2.5" fill="#fff"/>
    <!-- espinhas -->
    <path d="M220 162 l10 -18 l12 16z M260 160 l10 -18 l12 16z M300 163 l10 -16 l12 15z" fill="#FFD45A" stroke="#E8A93D" stroke-width="4" stroke-linejoin="round"/>
    <!-- cauda -->
    <path d="M415 235 q60 5 85 -25 q5 30 -20 48 q-35 22 -70 10z" fill="#55B8F7" stroke="#2568A8" stroke-width="6" stroke-linejoin="round"/>
    <path d="M498 208 l22 -14 l-4 24z" fill="#FFD45A" stroke="#E8A93D" stroke-width="4" stroke-linejoin="round"/>
    <!-- patinhas -->
    <path d="M250 262 q-5 25 12 30 M330 264 q0 25 16 28" fill="none" stroke="#2568A8" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
