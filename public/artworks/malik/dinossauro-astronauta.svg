<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#1B1145"/>
  <!-- estrelas -->
  <g fill="#FFD45A">
    <path d="M90 70 l6 13 14 2 -10 10 2 14 -12 -7 -12 7 2 -14 -10 -10 14 -2z"/>
    <path d="M490 60 l6 13 14 2 -10 10 2 14 -12 -7 -12 7 2 -14 -10 -10 14 -2z"/>
    <path d="M300 45 l5 11 12 2 -9 8 2 12 -10 -6 -10 6 2 -12 -9 -8 12 -2z"/>
    <circle cx="180" cy="110" r="4"/><circle cx="420" cy="120" r="4"/>
    <circle cx="540" cy="150" r="4"/><circle cx="60" cy="180" r="4"/>
  </g>
  <!-- planeta terra pequeno -->
  <circle cx="510" cy="330" r="42" fill="#55B8F7" stroke="#2568A8" stroke-width="5"/>
  <path d="M485 320 q20 -12 35 2 q15 12 25 4" fill="none" stroke="#71D6A2" stroke-width="9" stroke-linecap="round"/>
  <!-- lua (chão) -->
  <path d="M0 330 q300 -45 600 0 l0 120 l-600 0z" fill="#CFC8E8" stroke="#9C93C4" stroke-width="5"/>
  <circle cx="120" cy="395" r="18" fill="#B5ACD6"/>
  <circle cx="470" cy="415" r="24" fill="#B5ACD6"/>
  <circle cx="330" cy="425" r="12" fill="#B5ACD6"/>
  <!-- dinossauro astronauta -->
  <g>
    <!-- cauda -->
    <path d="M180 300 q-60 10 -85 55 q45 8 90 -15z" fill="#71D6A2" stroke="#3EA873" stroke-width="6" stroke-linejoin="round"/>
    <!-- corpo -->
    <path d="M180 300 q-10 -80 60 -110 q80 -35 140 10 q45 35 30 95 q-10 50 -70 60 q-90 15 -160 -55z" fill="#71D6A2" stroke="#3EA873" stroke-width="6" stroke-linejoin="round"/>
    <!-- barriga -->
    <path d="M250 320 q60 20 130 -5 q-15 40 -70 42 q-45 0 -60 -37z" fill="#D8F5E6"/>
    <!-- capacete -->
    <circle cx="330" cy="160" r="78" fill="#EAF6FF" opacity=".92" stroke="#B7D9F5" stroke-width="7"/>
    <!-- cabeça dentro do capacete -->
    <path d="M285 165 q0 -45 45 -48 q48 -3 52 40 q3 30 -20 42 q-30 15 -55 -2 q-22 -14 -22 -32z" fill="#71D6A2" stroke="#3EA873" stroke-width="5"/>
    <!-- focinho -->
    <path d="M370 160 q25 2 22 20 q-3 15 -25 12z" fill="#71D6A2" stroke="#3EA873" stroke-width="5"/>
    <!-- olho e sorriso -->
    <circle cx="320" cy="150" r="7" fill="#100B35"/>
    <circle cx="322" cy="148" r="2.5" fill="#fff"/>
    <path d="M350 180 q10 8 22 4" fill="none" stroke="#3EA873" stroke-width="4" stroke-linecap="round"/>
    <!-- bochecha -->
    <circle cx="305" cy="172" r="6" fill="#FF9DBB" opacity=".8"/>
    <!-- reflexo do capacete -->
    <path d="M285 105 q-22 12 -26 35" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".9"/>
    <!-- espinhas -->
    <path d="M235 200 l8 -20 l14 16z M270 185 l8 -20 l14 16z" fill="#FFD45A" stroke="#E8A93D" stroke-width="4" stroke-linejoin="round"/>
    <!-- braço acenando -->
    <path d="M395 250 q40 -20 55 -55" fill="none" stroke="#3EA873" stroke-width="16" stroke-linecap="round"/>
    <circle cx="452" cy="192" r="12" fill="#71D6A2" stroke="#3EA873" stroke-width="5"/>
    <!-- pernas -->
    <path d="M250 350 q-5 30 15 38 M330 355 q0 28 18 35" fill="none" stroke="#3EA873" stroke-width="16" stroke-linecap="round"/>
    <!-- botas -->
    <ellipse cx="268" cy="392" rx="18" ry="10" fill="#6D3FD3" stroke="#4B237C" stroke-width="5"/>
    <ellipse cx="352" cy="393" rx="18" ry="10" fill="#6D3FD3" stroke="#4B237C" stroke-width="5"/>
  </g>
  <!-- bandeirinha na lua -->
  <path d="M80 350 v-60 l55 14 -55 16z" fill="#FF5C8A" stroke="#C22B5C" stroke-width="5" stroke-linejoin="round"/>
  <path d="M80 350 v-60" stroke="#8a6d3b" stroke-width="6" stroke-linecap="round"/>
</svg>
